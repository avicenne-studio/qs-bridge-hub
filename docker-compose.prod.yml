services:
  hub:
    image: europe-west9-docker.pkg.dev/qubic-485810/${WORKSPACE}/hub:latest
    env_file:
      - /opt/hub/.env.prod
    volumes:
      - hub-sqlite:/data
      - /opt/hub/keys.json:/opt/hub/keys.json:ro
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/hub/www:/usr/share/nginx/html:ro
      - /opt/hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/hub/ssl:/etc/nginx/ssl:ro
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-sqlite:
